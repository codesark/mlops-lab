[project]
name = "mlops-lab"
version = "0.1.0"
description = "MLOps lab: notebook -> package -> CI gates -> MLflow registry -> gated mock deployment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Azure ML's MLflow backend does not support MLflow 3.x (no logged-models
    # endpoints); mlflow-skinny must match exactly or uv resolves a 3.x skinny
    # from azureml-mlflow and clobbers the mlflow package.
    "mlflow==2.22.5",
    "mlflow-skinny==2.22.5",
    "azureml-mlflow==1.62.0.post5",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
mlops = "mlops_lab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's idiom is function calls in argument defaults
"src/mlops_lab/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
