name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC federated login to Azure

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  train-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [housing_ridge, housing_xgb, cancer_logreg, cancer_xgb]
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A broken CLI credential would fall through to interactive-browser auth
      # inside mlflow and hang the job — fail fast instead.
      - name: Auth preflight
        run: az account show --query name -o tsv

      - name: Train candidate
        run: uv run mlops train --config configs/${{ matrix.config }}.yaml

      - name: Evaluate gates + champion comparison
        id: gate
        continue-on-error: true
        run: >
          uv run mlops evaluate --config configs/${{ matrix.config }}.yaml
          --champion-from-registry --output-md report.md

      - name: Publish job summary
        if: always()
        run: '[ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Post sticky PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          [ -f report.md ] &&
          ./scripts/pr_comment.sh "${{ matrix.config }}" report.md
          "${{ github.event.pull_request.number }}" || true

      - name: Fail job if gates failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
