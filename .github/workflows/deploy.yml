name: Deploy

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Registered model to deploy"
        type: choice
        required: true
        options:
          - housing-price
          - cancer-classifier

permissions:
  contents: read
  id-token: write # OIDC federated login to Azure

# Serialize promotions so two deploys can't race a stage tag.
concurrency:
  group: model-promotion
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Auth preflight
        run: az account show --query name -o tsv

      - name: Deploy staging-tagged model to staging (mock)
        run: >
          uv run mlops deploy --model "${{ inputs.model }}" --stage staging --env staging
          --actor "${{ github.actor }}" --git-sha "${GITHUB_SHA::7}"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-staging-${{ inputs.model }}
          path: deployments/

  # Pauses here until the required reviewer on the `production` environment
  # approves — the "manager sign-off" step of the lab.
  promote-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Auth preflight
        run: az account show --query name -o tsv

      - name: Promote staging -> production
        run: uv run mlops promote --model "${{ inputs.model }}"

      - name: Deploy production-tagged model to production (mock)
        run: >
          uv run mlops deploy --model "${{ inputs.model }}" --stage production --env production
          --actor "${{ github.actor }}" --git-sha "${GITHUB_SHA::7}"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-production-${{ inputs.model }}
          path: deployments/
