name: Deploy

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Registered model to deploy"
        type: choice
        required: true
        options:
          - housing-price
          - cancer-classifier

permissions:
  contents: write

concurrency:
  group: mlflow-registry
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - name: Checkout shared registry
        run: >
          ./scripts/registry_checkout.sh
          "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Start MLflow server
        run: ./scripts/mlflow_server.sh start registry

      - name: Deploy @staging model to staging (mock)
        run: >
          uv run mlops deploy --model "${{ inputs.model }}" --alias staging --env staging
          --actor "${{ github.actor }}" --git-sha "${GITHUB_SHA::7}"

      - name: Stop MLflow server
        run: ./scripts/mlflow_server.sh stop

      - name: Push registry state
        run: ./scripts/registry_push.sh "deploy: ${{ inputs.model }} to staging"

      - name: Show server log on failure
        if: failure()
        run: cat mlflow-server.log || true

  # Pauses here until the required reviewer on the `production` environment
  # approves — the "manager sign-off" step of the lab.
  promote-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      # Fresh checkout: picks up the staging manifest the previous job pushed.
      - name: Checkout shared registry
        run: >
          ./scripts/registry_checkout.sh
          "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Start MLflow server
        run: ./scripts/mlflow_server.sh start registry

      - name: Promote @staging -> @production
        run: uv run mlops promote --model "${{ inputs.model }}"

      - name: Deploy @production model to production (mock)
        run: >
          uv run mlops deploy --model "${{ inputs.model }}" --alias production --env production
          --actor "${{ github.actor }}" --git-sha "${GITHUB_SHA::7}"

      - name: Stop MLflow server
        run: ./scripts/mlflow_server.sh stop

      - name: Push registry state
        run: ./scripts/registry_push.sh "deploy: ${{ inputs.model }} to production"

      - name: Show server log on failure
        if: failure()
        run: cat mlflow-server.log || true
