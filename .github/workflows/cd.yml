name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "notebooks/**"
      - "**.md"

permissions:
  contents: read
  id-token: write # OIDC federated login to Azure

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Auth preflight
        run: az account show --query name -o tsv

      - name: Train all candidates
        run: |
          for c in configs/*.yaml; do
            uv run mlops train --config "$c"
          done

      - name: Check absolute gates (safety net)
        run: |
          for c in configs/*.yaml; do
            uv run mlops evaluate --config "$c"
          done

      - name: Register best candidates -> stage=staging
        run: |
          uv run mlops register --model housing-price --git-sha "${GITHUB_SHA::7}"
          uv run mlops register --model cancer-classifier --git-sha "${GITHUB_SHA::7}"
